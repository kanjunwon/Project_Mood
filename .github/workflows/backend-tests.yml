name: Backend Tests

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (CPU only, torch 가볍게)
        run: |
          pip install fastapi "uvicorn[standard]" supabase python-dotenv pydantic pytest httpx

      - name: Run tests
        run: python -m pytest
